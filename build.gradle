plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5' // Note: A more stable version might be preferable than a patch release
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Database Driver
	// This is the correct, modern dependency for MySQL. The old one was removed.
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok (Correct Configuration)
	// Using annotationProcessor is the standard way to configure Lombok
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	// spring-boot-starter-test already includes JUnit 5, so the old junit:junit dependency is not needed.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
